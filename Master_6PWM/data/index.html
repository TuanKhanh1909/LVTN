<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mars Rover Controller</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="topnav">
        <h1>🚀 Mars Rover Controller</h1>
    </div>
    <div class="content">
        
        <div class="card" style="margin-bottom: 20px;">
            <p class="card-title" style="margin-bottom: 15px; text-align: center;">🎮 Nguồn Điều Khiển</p>
            
            <div class="safety-container" style="margin-bottom: 15px;">
                <span class="safety-label">🌐 Cho phép WEB lái:</span>
                <label class="switch">
                    <input type="checkbox" id="webModeBtn" onchange="toggleMode('WEB')">
                    <span class="slider-toggle round"></span>
                </label>
            </div>

            <div class="safety-container" style="margin-bottom: 15px;">
                <span class="safety-label">📡 Cho phép ESP-NOW lái:</span>
                <label class="switch">
                    <input type="checkbox" id="espModeBtn" onchange="toggleMode('ESPNOW')">
                    <span class="slider-toggle round"></span>
                </label>
            </div>

            <div style="text-align: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1);">
                <span style="color: #888;">Đang hoạt động: </span>
                <span id="activeModeText" style="font-weight: bold; color: #2ecc71; font-size: 1.1rem;">🎮 Tay cầm RC</span>
            </div>
        </div>
        
        <div class="control-grid">
            <div class="card">
                <p class="card-title">🎮 Hướng (Direction)</p>
                <div class="joystick-container">
                    <div class="joystick-base">
                        <div class="axis-line vertical"></div>
                        <div class="axis-line horizontal"></div>
                        <div class="center-dot"></div>
                        <div class="joystick-handle" id="joystick"></div>
                    </div>
                </div>
                <div class="status-grid">
                    <div class="status-item">
                        <div class="status-label">X Position</div>
                        <div class="status-value" id="xValue">2048</div>
                    </div>
                    <div class="status-item">
                        <div class="status-label">Y Position</div>
                        <div class="status-value" id="yValue">2048</div>
                    </div>
                </div>
            </div>
            <div class="card">
                <p class="card-title">⚡ Tốc độ (Limit)</p>
                <div class="speed-container">
                    <div class="speed-labels"><span>MAX</span></div>
                    <div class="slider-wrapper">
                        <input type="range" id="speedSlider" class="speed-slider"
                               min="0" max="4095" value="0" step="1">
                    </div>
                    <div class="speed-labels"><span>MIN</span></div>
                </div>
                <div class="status-grid">
                    <div class="status-item">
                        <div class="status-label">Speed Limit</div>
                        <div class="status-value" id="speedValue">0%</div>
                    </div>
                    <div class="status-item">
                        <div class="status-label">POT Value</div>
                        <div class="status-value" id="potValue">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="mode-display">
                <div class="mode-text" id="modeDisplay">🔄 NEUTRAL</div>
            </div>
            <div class="connection-status connection-ok" id="connectionStatus">
                🟢 Connection: Connecting...
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
